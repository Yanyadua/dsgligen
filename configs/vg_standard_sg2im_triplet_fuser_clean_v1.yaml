# Proposal only: this file is an approved-protocol template, not a command to
# launch training.  It keeps the official GLIGEN/SD and UNet fusers frozen and
# learns only an endpoint-bound scene-graph residual plus its small geometry
# head after the fixed-30 visual gate has passed.
diffusion:
  target: ldm.models.diffusion.ldm.LatentDiffusion
  params:
    linear_start: 0.00085
    linear_end: 0.012
    timesteps: 1000

model:
  target: ldm.modules.diffusionmodules.openaimodel.UNetModel
  params:
    image_size: 64
    in_channels: 4
    out_channels: 4
    model_channels: 320
    attention_resolutions: [4, 2, 1]
    num_res_blocks: 2
    channel_mult: [1, 2, 4, 4]
    num_heads: 8
    transformer_depth: 1
    context_dim: 768
    fuser_type: gatedSA
    use_checkpoint: true
    grounding_tokenizer:
      target: ldm.modules.diffusionmodules.scene_graph_grounding_net.PositionNet
      params:
        in_dim: 768
        out_dim: 768
        hidden_dim: 768
        base_hidden_dim: 512
        # Deliberately disable the old global GAT path for this ablation.
        gat_layers: 0
        relation_dim: 768
        relation_geo_dim: 12
        graph_gate_init: -4.0
        graph_delta_max_ratio: 0.0
        use_triplet_fuser: true
        triplet_fuser_hidden_dim: 768
        triplet_gate_init: -2.0
        triplet_delta_max_ratio: 0.25
        relation_visual_dim: 64
        graph_visual_dim: 64
        relation_predicate_classes: 64

autoencoder:
  target: ldm.models.autoencoder.AutoencoderKL
  params:
    scale_factor: 0.18215
    embed_dim: 4
    ddconfig:
      double_z: true
      z_channels: 4
      resolution: 256
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult: [1, 2, 4, 4]
      num_res_blocks: 2
      attn_resolutions: []
      dropout: 0.0

text_encoder:
  target: ldm.modules.encoders.modules.FrozenCLIPEmbedder

train_dataset_names:
  VGSceneGraph:
    image_root: /root/autodl-tmp/standard_sg2im_fresh_h5/images
    h5_path: /root/autodl-tmp/standard_sg2im_fresh_h5/train.h5
    vocab_path: /root/autodl-tmp/standard_sg2im_fresh_h5/vocab.json
    image_size: 256
    random_crop: false
    random_flip: true
    box_transform_mode: gligen
    conditioning_policy: clean_spatial_v1
    caption_policy: clean_primary
    min_box_size: 0.0
    max_boxes_per_data: 6
    max_relations_per_data: 1
    prob_use_caption: 1.0

grounding_tokenizer_input:
  target: grounding_input.scene_graph_grounding_tokenizer_input.GroundingNetInput

# Future approved run: only triplet_fuser, triplet_gate and relation_geo head
# are trainable.  Start with diffusion + masked geometry; all complex graph
# alignment/distillation objectives remain intentionally off.
freeze_position_base: true
triplet_fuser_only: true
fuser_train_mode: frozen
diffusion_loss_weight: 1.0
object_align_loss_weight: 0.0
spatial_consistency_loss_weight: 0.0
relation_geo_prediction_loss_weight: 0.05
relation_geo_prediction_beta: 0.1
relation_geo_prediction_filter_predicates: true
relation_geo_prediction_source: masked_graph_delta
relation_visual_align_loss_weight: 0.0
graph_image_align_loss_weight: 0.0
masked_relation_loss_weight: 0.0
