diffusion:
  target: ldm.models.diffusion.ldm.LatentDiffusion
  params:
    linear_start: 0.00085
    linear_end: 0.012
    timesteps: 1000

model:
  target: ldm.modules.diffusionmodules.openaimodel.UNetModel
  params:
    image_size: 64
    in_channels: 4
    out_channels: 4
    model_channels: 320
    attention_resolutions: [4, 2, 1]
    num_res_blocks: 2
    channel_mult: [1, 2, 4, 4]
    num_heads: 8
    transformer_depth: 1
    context_dim: 768
    fuser_type: gatedSA
    use_checkpoint: True

    grounding_tokenizer:
      target: ldm.modules.diffusionmodules.text_grounding_net.PositionNet
      params:
        in_dim: 768
        out_dim: 768

autoencoder:
  target: ldm.models.autoencoder.AutoencoderKL
  params:
    scale_factor: 0.18215
    embed_dim: 4
    ddconfig:
      double_z: true
      z_channels: 4
      resolution: 256
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult: [1, 2, 4, 4]
      num_res_blocks: 2
      attn_resolutions: []
      dropout: 0.0

text_encoder:
  target: ldm.modules.encoders.modules.FrozenCLIPEmbedder

train_dataset_names:
  VGGrounding:
    image_root: /root/autodl-tmp/standard_sg2im_fresh_h5/images
    h5_path: /root/autodl-tmp/standard_sg2im_fresh_h5/train.h5
    vocab_path: /root/autodl-tmp/standard_sg2im_fresh_h5/vocab.json
    image_size: 256
    random_crop: false
    random_flip: true
    max_boxes_per_data: 30
    max_relations_per_data: 30
    prob_use_caption: 1.0
  VGSceneGraph:
    image_root: /root/autodl-tmp/standard_sg2im_fresh_h5/images
    h5_path: /root/autodl-tmp/standard_sg2im_fresh_h5/train.h5
    vocab_path: /root/autodl-tmp/standard_sg2im_fresh_h5/vocab.json
    image_size: 256
    random_crop: false
    random_flip: true
    max_boxes_per_data: 30
    max_relations_per_data: 30
    prob_use_caption: 1.0

grounding_tokenizer_input:
  target: grounding_input.text_grounding_tokinzer_input.GroundingNetInput

diffusion_loss_weight: 1.0
object_align_loss_weight: 0.0
spatial_consistency_loss_weight: 0.0
relation_geo_prediction_loss_weight: 0.0
relation_visual_align_loss_weight: 0.0
graph_image_align_loss_weight: 0.0
masked_relation_loss_weight: 0.0
